[package]
name = "focustube"
version = "0.1.0"
description = "A focused, always-on-top YouTube player for working-while-watching"
authors = ["you"]
edition = "2021"

[lib]
name = "focustube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
