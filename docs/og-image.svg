<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="FocusTube — a clean, always-on-top YouTube player">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .sora { font-family: 'Sora', system-ui, sans-serif; }
      .inter { font-family: 'Inter', system-ui, sans-serif; }
    </style>

    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a3d" />
      <stop offset="42%" stop-color="#ff3d8b" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>

    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d8b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff3d8b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="video" cx="30%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#2a2030" />
      <stop offset="70%" stop-color="#0c0d14" />
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#08080c" />

  <!-- aurora -->
  <g filter="url(#soft)">
    <circle cx="160" cy="80" r="300" fill="url(#b1)" />
    <circle cx="1080" cy="560" r="320" fill="url(#b2)" />
    <circle cx="780" cy="240" r="220" fill="url(#b3)" />
  </g>

  <!-- brand -->
  <g transform="translate(64,58)">
    <rect width="32" height="32" rx="9" fill="#141318" />
    <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 5 12 L 5 7 L 10 7" />
      <path d="M 22 7 L 27 7 L 27 12" />
      <path d="M 5 20 L 5 25 L 10 25" />
      <path d="M 27 20 L 27 25 L 22 25" />
    </g>
    <circle cx="5" cy="7" r="1" fill="#FF6A3D" />
    <circle cx="27" cy="7" r="1" fill="#FF6A3D" />
    <circle cx="5" cy="25" r="1" fill="#FF6A3D" />
    <circle cx="27" cy="25" r="1" fill="#FF6A3D" />
    <path d="M 12 11 C 12 9.7 13.2 9 14.2 9.6 L 21.2 14.4 C 22.2 15 22.2 16 21.2 16.6 L 14.2 21.4 C 13.2 22 12 21.3 12 20 Z" fill="#FF6A3D" />
    <text x="44" y="24" class="sora" font-weight="800" font-size="24" fill="#f3f4f8">FocusTube</text>
  </g>

  <!-- headline -->
  <g transform="translate(64,232)">
    <text class="sora" font-weight="800" font-size="62" fill="#f3f4f8">Watch YouTube</text>
    <text y="74" class="sora" font-weight="800" font-size="62" fill="url(#grad)">without the noise.</text>
  </g>

  <text x="64" y="372" class="inter" font-weight="500" font-size="20" fill="#9aa1b2">
    A borderless, always-on-top player that floats while you work.
  </text>

  <!-- floating app mockup -->
  <g transform="rotate(-4 905 330)" filter="url(#shadow)">
    <rect x="700" y="150" width="360" height="232" rx="18" fill="#12131a" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14" />
    <!-- title bar -->
    <line x1="700" y1="188" x2="1060" y2="188" stroke="#ffffff" stroke-opacity="0.08" />
    <rect x="716" y="164" width="14" height="14" rx="4" fill="#141318" />
    <rect x="716.5" y="164.5" width="13" height="13" rx="3.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 719 168 L 719 166 L 721 166" />
      <path d="M 725 166 L 727 166 L 727 168" />
      <path d="M 719 174 L 719 176 L 721 176" />
      <path d="M 727 174 L 727 176 L 725 176" />
    </g>
    <circle cx="719" cy="166" r="0.8" fill="#FF6A3D" />
    <circle cx="727" cy="166" r="0.8" fill="#FF6A3D" />
    <circle cx="719" cy="176" r="0.8" fill="#FF6A3D" />
    <circle cx="727" cy="176" r="0.8" fill="#FF6A3D" />
    <path d="M 722 169.5 C 722 169 722.6 168.7 723.1 168.9 L 727 171.5 C 727.4 171.7 727.4 172.3 727 172.5 L 723.1 175.1 C 722.6 175.3 722 175 722 174.5 Z" fill="#FF6A3D" />
    <text x="738" y="176" class="inter" font-weight="600" font-size="13" fill="#f3f4f8">FocusTube</text>
    <rect x="980" y="169" width="22" height="4" rx="2" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="1012" cy="171" r="4" fill="#ffffff" fill-opacity="0.3" />
    <rect x="1028" y="167" width="12" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.3" />
    <rect x="1046" y="166" width="10" height="10" rx="3" fill="#ff6a3d" />
    <!-- video -->
    <rect x="712" y="198" width="336" height="172" rx="11" fill="url(#video)" />
    <rect x="712" y="198" width="336" height="172" rx="11" fill="url(#grad)" fill-opacity="0.12" />
    <circle cx="880" cy="284" r="27" fill="#ffffff" fill-opacity="0.92" />
    <path d="M872 270l16 14-16 14z" fill="#111" />
    <text x="724" y="358" class="inter" font-size="11" fill="#ffffff" fill-opacity="0.7" font-family="ui-monospace, monospace">12:04 / 48:20</text>
    <g transform="translate(980,348)">
      <rect width="84" height="22" rx="11" fill="#ff6a3d" fill-opacity="0.18" stroke="#ff6a3d" stroke-opacity="0.4" />
      <text x="42" y="15" text-anchor="middle" class="inter" font-size="11" fill="#f3f4f8">always on top</text>
    </g>
  </g>
</svg>