name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            asset: "src-tauri/target/release/bundle/nsis/FocusTube_*_x64-setup.exe"
            upload: "FocusTube-Windows-x64-setup.exe"
          - platform: macos-latest
            args: ""
            asset: "src-tauri/target/release/bundle/macos/FocusTube.app.tar.gz"
            upload: "FocusTube-macOS.tar.gz"
          - platform: ubuntu-22.04
            args: ""
            asset: "src-tauri/target/release/bundle/appimage/FocusTube_*_amd64.AppImage"
            upload: "FocusTube-Linux-x64.AppImage"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install NSIS (Windows installer)
        if: matrix.platform == 'windows-latest'
        run: choco install nsis -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Rename asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: mkdir -p dist && cp ${{ matrix.asset }} dist/${{ matrix.upload }}

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.upload }}
